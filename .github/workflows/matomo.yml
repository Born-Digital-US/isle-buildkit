name: Build and Push Matomo Image
# Builds only matomo/ (FROM islandora/nginx) and pushes it for amd64 + arm64.
# Runs on tags named matomo-<image tag>, e.g. matomo-5.3.2-7.0.21 → borndigital/matomo:5.3.2-7.0.21.
# push.yml is removed on this branch so branch pushes don't rebuild every image.
on:
  push:
    tags:
      - 'matomo-*'
permissions:
  contents: read
concurrency:
  group: ${{ github.ref }}
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up QEMU
        uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to Docker Hub
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PASSWORD }}

      - name: Image tag
        id: tag
        run: echo "tag=${GITHUB_REF_NAME#matomo-}" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: matomo
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ vars.REPOSITORY }}/matomo:${{ steps.tag.outputs.tag }}
